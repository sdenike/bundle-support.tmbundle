name: Regenerate BundleFileTypeIndex

on:
  push:
    branches: [main]
    paths:
      - Support/DefaultBundles.plist
      - Support/AvailableBundles.plist
      - Support/build_filetype_index.rb
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regen:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Run generator
        env:
          GH_TOKEN: ${{ github.token }}
        run: ruby Support/build_filetype_index.rb

      - name: Commit regenerated index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- Support/BundleFileTypeIndex.plist; then
            echo "No index changes; nothing to commit."
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Support/BundleFileTypeIndex.plist
          git commit -m 'Regenerate BundleFileTypeIndex.plist'
          git push
